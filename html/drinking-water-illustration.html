<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喝水插图 - 健康生活</title>
    
    <!-- Tailwind CSS -->
    <script src="https://storage.360buyimg.com/dist-dev/joycoder/fe-page-cdn/tailwindcss.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://storage.360buyimg.com/dist-dev/joycoder/fe-page-cdn/lucide.js"></script>
    
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        border: "hsl(214.3 31.8% 91.4%)",
                        input: "hsl(214.3 31.8% 91.4%)",
                        ring: "hsl(222.2 84% 4.9%)",
                        background: "hsl(0 0% 100%)",
                        foreground: "hsl(222.2 84% 4.9%)",
                        primary: {
                            DEFAULT: "hsl(222.2 47.4% 11.2%)",
                            foreground: "hsl(210 40% 98%)",
                        },
                        secondary: {
                            DEFAULT: "hsl(210 40% 96%)",
                            foreground: "hsl(222.2 84% 4.9%)",
                        },
                        muted: {
                            DEFAULT: "hsl(210 40% 96%)",
                            foreground: "hsl(215.4 16.3% 46.9%)",
                        },
                        accent: {
                            DEFAULT: "hsl(210 40% 96%)",
                            foreground: "hsl(222.2 84% 4.9%)",
                        },
                        card: {
                            DEFAULT: "hsl(0 0% 100%)",
                            foreground: "hsl(222.2 84% 4.9%)",
                        },
                    },
                    animation: {
                        'water-drop': 'waterDrop 2s ease-in-out infinite',
                        'drinking': 'drinking 3s ease-in-out infinite',
                        'bubble': 'bubble 2s ease-in-out infinite',
                    },
                    keyframes: {
                        waterDrop: {
                            '0%, 100%': { transform: 'translateY(0px)', opacity: '1' },
                            '50%': { transform: 'translateY(-10px)', opacity: '0.7' },
                        },
                        drinking: {
                            '0%, 100%': { transform: 'rotate(0deg)' },
                            '50%': { transform: 'rotate(-15deg)' },
                        },
                        bubble: {
                            '0%': { transform: 'translateY(0px) scale(0.8)', opacity: '0.6' },
                            '50%': { transform: 'translateY(-20px) scale(1)', opacity: '1' },
                            '100%': { transform: 'translateY(-40px) scale(0.6)', opacity: '0' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        .water-glass {
            background: linear-gradient(180deg, 
                rgba(59, 130, 246, 0.1) 0%, 
                rgba(59, 130, 246, 0.3) 100%);
        }
        
        .water-level {
            background: linear-gradient(180deg, 
                rgba(59, 130, 246, 0.6) 0%, 
                rgba(59, 130, 246, 0.8) 100%);
        }
        
        .person-skin {
            fill: #f4a261;
        }
        
        .person-hair {
            fill: #2d3436;
        }
        
        .person-clothes {
            fill: #74b9ff;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-green-50">
    <div class="container mx-auto px-4 py-8">
        <!-- 标题区域 -->
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold text-gray-800 mb-4 flex items-center justify-center gap-3">
                <i data-lucide="droplets" class="h-10 w-10 text-blue-500"></i>
                健康喝水
            </h1>
            <p class="text-lg text-gray-600 max-w-2xl mx-auto">
                保持充足的水分摄入是健康生活的重要组成部分。每天喝足够的水有助于维持身体正常功能。
            </p>
        </header>

        <!-- 主要插图区域 -->
        <div class="max-w-4xl mx-auto">
            <div class="bg-white rounded-3xl shadow-2xl p-8 mb-8">
                <div class="flex flex-col lg:flex-row items-center justify-between gap-8">
                    <!-- 人物喝水插图 -->
                    <div class="flex-1 flex justify-center">
                        <div class="relative">
                            <!-- 人物SVG插图 -->
                            <svg width="300" height="400" viewBox="0 0 300 400" class="animate-drinking">
                                <!-- 背景圆圈 -->
                                <circle cx="150" cy="200" r="140" fill="rgba(59, 130, 246, 0.1)" stroke="rgba(59, 130, 246, 0.2)" stroke-width="2"/>
                                
                                <!-- 人物身体 -->
                                <ellipse cx="150" cy="320" rx="60" ry="80" class="person-clothes"/>
                                
                                <!-- 人物头部 -->
                                <circle cx="150" cy="180" r="50" class="person-skin"/>
                                
                                <!-- 头发 -->
                                <path d="M 100 160 Q 150 120 200 160 Q 190 140 150 140 Q 110 140 100 160" class="person-hair"/>
                                
                                <!-- 眼睛 -->
                                <circle cx="135" cy="170" r="3" fill="#2d3436"/>
                                <circle cx="165" cy="170" r="3" fill="#2d3436"/>
                                
                                <!-- 嘴巴 -->
                                <path d="M 140 190 Q 150 200 160 190" stroke="#2d3436" stroke-width="2" fill="none"/>
                                
                                <!-- 手臂 -->
                                <ellipse cx="90" cy="280" rx="20" ry="50" class="person-skin" transform="rotate(-30 90 280)"/>
                                <ellipse cx="210" cy="280" rx="20" ry="50" class="person-skin" transform="rotate(45 210 280)"/>
                                
                                <!-- 水杯 -->
                                <g transform="translate(180, 220) rotate(-15)">
                                    <!-- 杯子外形 -->
                                    <rect x="-15" y="-30" width="30" height="60" rx="5" fill="rgba(255, 255, 255, 0.9)" stroke="rgba(59, 130, 246, 0.5)" stroke-width="2"/>
                                    
                                    <!-- 水 -->
                                    <rect x="-12" y="-15" width="24" height="40" rx="3" class="water-level"/>
                                    
                                    <!-- 杯子把手 -->
                                    <path d="M 15 -10 Q 25 -10 25 0 Q 25 10 15 10" stroke="rgba(59, 130, 246, 0.7)" stroke-width="3" fill="none"/>
                                    
                                    <!-- 水滴效果 -->
                                    <circle cx="0" cy="-35" r="2" fill="rgba(59, 130, 246, 0.8)" class="animate-water-drop"/>
                                </g>
                            </svg>
                            
                            <!-- 气泡效果 -->
                            <div class="absolute top-20 left-32">
                                <div class="w-3 h-3 bg-blue-200 rounded-full animate-bubble opacity-60"></div>
                            </div>
                            <div class="absolute top-24 left-36 animation-delay-500">
                                <div class="w-2 h-2 bg-blue-300 rounded-full animate-bubble opacity-50"></div>
                            </div>
                            <div class="absolute top-28 left-40 animation-delay-1000">
                                <div class="w-4 h-4 bg-blue-100 rounded-full animate-bubble opacity-40"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 信息面板 -->
                    <div class="flex-1 space-y-6">
                        <div class="bg-gradient-to-r from-blue-50 to-green-50 rounded-2xl p-6">
                            <h3 class="text-2xl font-semibold text-gray-800 mb-4 flex items-center gap-2">
                                <i data-lucide="heart" class="h-6 w-6 text-red-500"></i>
                                喝水的好处
                            </h3>
                            <ul class="space-y-3">
                                <li class="flex items-center gap-3 text-gray-700">
                                    <i data-lucide="check-circle" class="h-5 w-5 text-green-500"></i>
                                    促进新陈代谢
                                </li>
                                <li class="flex items-center gap-3 text-gray-700">
                                    <i data-lucide="check-circle" class="h-5 w-5 text-green-500"></i>
                                    维持体温平衡
                                </li>
                                <li class="flex items-center gap-3 text-gray-700">
                                    <i data-lucide="check-circle" class="h-5 w-5 text-green-500"></i>
                                    帮助消化吸收
                                </li>
                                <li class="flex items-center gap-3 text-gray-700">
                                    <i data-lucide="check-circle" class="h-5 w-5 text-green-500"></i>
                                    保持皮肤水润
                                </li>
                                <li class="flex items-center gap-3 text-gray-700">
                                    <i data-lucide="check-circle" class="h-5 w-5 text-green-500"></i>
                                    提升精神状态
                                </li>
                            </ul>
                        </div>
                        
                        <div class="bg-gradient-to-r from-green-50 to-blue-50 rounded-2xl p-6">
                            <h3 class="text-xl font-semibold text-gray-800 mb-4 flex items-center gap-2">
                                <i data-lucide="clock" class="h-6 w-6 text-blue-500"></i>
                                每日建议
                            </h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="text-center">
                                    <div class="text-3xl font-bold text-blue-600">8</div>
                                    <div class="text-sm text-gray-600">杯水/天</div>
                                </div>
                                <div class="text-center">
                                    <div class="text-3xl font-bold text-green-600">2L</div>
                                    <div class="text-sm text-gray-600">总水量</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 喝水时间提醒卡片 -->
            <div class="grid md:grid-cols-3 gap-6">
                <div class="bg-white rounded-2xl p-6 shadow-lg border border-blue-100">
                    <div class="flex items-center gap-3 mb-4">
                        <i data-lucide="sunrise" class="h-8 w-8 text-orange-500"></i>
                        <h3 class="text-lg font-semibold text-gray-800">晨起</h3>
                    </div>
                    <p class="text-gray-600 mb-3">起床后喝一杯温水，唤醒身体机能</p>
                    <div class="text-sm text-orange-600 font-medium">建议时间: 6:00-8:00</div>
                </div>
                
                <div class="bg-white rounded-2xl p-6 shadow-lg border border-green-100">
                    <div class="flex items-center gap-3 mb-4">
                        <i data-lucide="sun" class="h-8 w-8 text-yellow-500"></i>
                        <h3 class="text-lg font-semibold text-gray-800">餐前</h3>
                    </div>
                    <p class="text-gray-600 mb-3">餐前半小时喝水，帮助消化</p>
                    <div class="text-sm text-yellow-600 font-medium">建议时间: 餐前30分钟</div>
                </div>
                
                <div class="bg-white rounded-2xl p-6 shadow-lg border border-purple-100">
                    <div class="flex items-center gap-3 mb-4">
                        <i data-lucide="moon" class="h-8 w-8 text-purple-500"></i>
                        <h3 class="text-lg font-semibold text-gray-800">睡前</h3>
                    </div>
                    <p class="text-gray-600 mb-3">睡前1小时适量饮水，避免夜间频繁起夜</p>
                    <div class="text-sm text-purple-600 font-medium">建议时间: 21:00-22:00</div>
                </div>
            </div>
        </div>
        
        <!-- 底部提示 -->
        <footer class="text-center mt-12 py-8">
            <div class="inline-flex items-center gap-2 bg-white rounded-full px-6 py-3 shadow-lg">
                <i data-lucide="info" class="h-5 w-5 text-blue-500"></i>
                <span class="text-gray-700">记住：小口慢饮，温水为佳</span>
            </div>
        </footer>
    </div>

    <script>
        // 初始化Lucide图标
        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();
            
            // 添加交互效果
            const illustration = document.querySelector('.animate-drinking');
            
            illustration.addEventListener('mouseenter', function() {
                this.style.animationDuration = '1.5s';
            });
            
            illustration.addEventListener('mouseleave', function() {
                this.style.animationDuration = '3s';
            });
            
            // 添加点击效果
            illustration.addEventListener('click', function() {
                this.style.transform = 'scale(1.05)';
                setTimeout(() => {
                    this.style.transform = 'scale(1)';
                }, 200);
            });
        });
        
        // 添加滚动动画
        function animateOnScroll() {
            const cards = document.querySelectorAll('.bg-white');
            
            cards.forEach(card => {
                const cardTop = card.getBoundingClientRect().top;
                const windowHeight = window.innerHeight;
                
                if (cardTop < windowHeight * 0.8) {
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }
            });
        }
        
        // 初始化卡片动画状态
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.bg-white');
            cards.forEach(card => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                card.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
            });
            
            // 立即检查一次
            animateOnScroll();
        });
        
        window.addEventListener('scroll', animateOnScroll);
    </script>
</body>
</html>
